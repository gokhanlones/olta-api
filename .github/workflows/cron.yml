name: Save Grid Cron

# Günde bir kez: Copernicus'tan günün deniz verisini alır, haritanın ızgarasını
# Firestore'a yazar ve ana sayfa haberlerini üretir (/save-grid).
# Veri günlük ortalama olduğu için daha sık çalıştırmaya gerek yok.
on:
  schedule:
    # 03:17 UTC = 06:17 Türkiye. GitHub tam saat başlarında gecikebildiği için :17.
    - cron: '17 3 * * *'
  workflow_dispatch: {}   # Actions sekmesinden elle çalıştırmak için

jobs:
  save-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger save-grid
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET tanımlı değil (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          # Render ücretsiz sunucu uyanırken ~1 dk, grid hesabı birkaç dk sürebilir.
          curl --fail-with-body --silent --show-error \
               --max-time 600 --retry 3 --retry-delay 60 --retry-all-errors \
               -H "X-Cron-Secret: $CRON_SECRET" \
               "https://olta-api.onrender.com/save-grid?species=bluefish&region=turkey"
          echo
